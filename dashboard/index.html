<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Radar — pre-token protocols ranked by fitted implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"></div>
    <div>
      <h1>Launch Radar</h1>
      <p class="tagline">Pre-token protocols ranked by a value model fitted on the snapshot itself: peer multiples &times; token odds.</p>
    </div>
  </div>
  <div class="asof" id="asof"></div>
</header>

<section class="kpis" id="kpis" aria-label="Headline figures"></section>

<section class="controls" aria-label="Board controls">
  <label class="ctl grow">Search
    <input id="q" type="search" placeholder="Protocol name or slug" autocomplete="off">
  </label>
  <label class="ctl">Category
    <select id="f-category"></select>
  </label>
  <label class="ctl">Chain
    <select id="f-chain"></select>
  </label>
  <label class="ctl">Verdict
    <select id="f-verdict">
      <option value="">All verdicts</option>
      <option value="FARM">Farm</option>
      <option value="THIN">Thin</option>
      <option value="SKIP">Skip</option>
    </select>
  </label>
  <label class="ctl check">
    <input id="f-watch" type="checkbox"> Watchlist only
  </label>
  <div class="ctl views" role="group" aria-label="View">
    <button id="v-board" class="viewbtn active" type="button">Pre-token board</button>
    <button id="v-live" class="viewbtn" type="button">Live tokens</button>
    <button id="v-model" class="viewbtn" type="button">The model</button>
  </div>
</section>

<main>
  <section id="board-wrap">
    <table id="board" aria-label="Ranked pre-token protocols">
      <thead id="board-head"></thead>
      <tbody id="board-body"></tbody>
    </table>
    <p class="empty" id="board-empty" hidden>No protocol matches those filters. Loosen one and the radar sweeps again.</p>
  </section>

  <section id="detail" hidden aria-label="Protocol detail"></section>

  <section id="model" hidden aria-label="How the model is fitted and tested"></section>
</main>

<footer class="foot" id="foot"></footer>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
